name: community

x-app-common: &app-common
  image: ${ECR_REPO}:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - .env
  expose:
    - "8080"
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 40s
  networks:
    - app_net

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./.deploy/nginx/app-upstream.inc:/etc/nginx/conf.d/app-upstream.inc:ro
    networks:
      - app_net
  app_blue:
    <<: *app-common
  app_green:
    <<: *app-common
networks:
  app_net:
    driver: bridge